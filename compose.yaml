services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - media_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    environment:
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?Set DATABASE_ADMIN_URL in .env}
      AI08_DB_USER: ${AI08_DB_USER:?Set AI08_DB_USER in .env}
      AI08_DB_PASSWORD: ${AI08_DB_PASSWORD:?Set AI08_DB_PASSWORD in .env}
    command: ["python","-m","ai08.migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  ai08:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./models:/app/models:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  media_postgres_data:
